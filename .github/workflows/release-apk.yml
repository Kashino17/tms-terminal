name: Build & Release APK

# Builds the signed release APK on a GitHub runner (local Metro bundling hangs
# headless on the dev Mac) and publishes a GitHub Release so the in-app
# auto-updater shows the update banner. Triggered by pushing a vX.Y.Z tag
# (tag-triggered runs use the workflow file at the tagged commit, so it works
# from any branch without needing the workflow on the default branch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # The release keystore + Firebase config are gitignored, so CI gets them
      # from base64 repo secrets. Same keystore as local => stable signing key,
      # so the app updates over the existing install without a reinstall.
      - name: Restore release keystore
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}" | base64 -d > mobile/android/app/tms-release.keystore

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > mobile/android/app/google-services.json

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read app version
        id: ver
        run: echo "version=$(node -e "console.log(require('./mobile/app.json').expo.version)")" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk "TMS-Terminal-v${{ steps.ver.outputs.version }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          # The tag already exists (this run was triggered by pushing it), so we
          # only need to create the release object for it. Delete just a stale
          # release (not the tag) so re-runs succeed without re-triggering.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            "TMS-Terminal-v${{ steps.ver.outputs.version }}.apk" \
            --title "TMS Terminal $TAG" \
            --notes "Der Manager-Agent kann jetzt Termine und Erinnerungen. Sag ihm "erinnere mich am 4. August um 14 Uhr an den Zahnarzt" oder "meine Mutter hat am 30. Geburtstag" — er legt das an, fragt nach Vorlaufzeiten und meldet sich dann von selbst, als Push und als Nachricht im Chat. Geburtstage wiederholen sich jaehrlich von allein. Weil du viel reist, unterscheidet er zwei Arten von Terminen: wiederkehrende reisen mit dir mit (8 Uhr bleibt 8 Uhr, wo immer du bist), einmalige bleiben an die Zeitzone gebunden, in der du sie angelegt hast (der Zahnarzt in Berlin bleibt Berliner Zeit). Neue Reiter im Manager: Agenda und Notizen. Notizen und To-dos lassen sich direkt abhaken; Artifacts und Memory sind ins Menue gewandert. Oben in der Dynamic Island erscheint sein Profilbild mit der Zahl ungelesener Nachrichten — auch waehrend du im Terminal arbeitest; antippen springt in den Chat. Er weiss ausserdem, woran du arbeitest: er liest Projektstaende, Git-Branches und die Themen deiner letzten Sitzungen mit, meldet fertige Terminals und solche, die auf eine Antwort von dir warten, faellt bei wiederkehrenden Fehlern mit genau einem konkreten Vorschlag ein und fasst morgens und abends kurz zusammen, was ansteht. Alles gedeckelt: hoechstens ein Hinweis pro Terminal und Stunde, kein Thema zweimal, nachts keine Push ausser den Erinnerungen, die du selbst gelegt hast. Erinnerungen funktionieren auch dann, wenn gerade kein KI-Modell erreichbar ist." \
            --latest
